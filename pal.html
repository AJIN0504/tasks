
<script>
var str = window.prompt("enter the string here : ");
var len = str.length-1;
for(i= len,j=0;i>=0;i--,j++){
    if(str[i] != str[j]){
       document.write("the given string  "+str+" is not in palindrom");
       break;
       }
     }
       
  document.write("the given string  "+str+" is in palindrom");     
      
      
</script>
