<html>
<body>
 <h1> take list of fruits from user </h1>
 <script>
   var fruits =[];
   var n=Number(window.prompt("enter the number of fruits to be added :"));
   
   for(var i=0;i<n;i++)
    {
         fruits[i] = window.prompt("enter the fruits:");
          
    }
    
    for(var i=0;i<n;i++)
    {
         document.write("fruit: "+ fruits[i] + "<br/>");
          
    }
    
    
 </script>
</body>
</html>
