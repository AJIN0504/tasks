<html>
<body>
  <h1>to check value is positive ,negative or zero</h1>
  <script>
    var x = Number(window.prompt("enter a number:"));
    
    if(x>0){
      document.write("the value given is "+ x +" & its positive");
     }
    else if(x<0){
     document.write("the value given is "+ x +" & its negative");
     }
    else{
     document.write("the value given is "+ x +" & its 0");
     }
  </script> 
</body>        
</html>
