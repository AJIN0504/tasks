<html>
<body>
 <h1> swapping values </h1>
 <script>
   var x = Number(window.prompt("enter a value for x:"));
   var y = Number(window.prompt("enter a value for y:"));
   
   x=x+y;
   y=x-y;
   x=x-y;
   
   document.write("value after swap !  ");
   document.write("value of x is : "+ x +" and value of y is :"+ y);
 </script>  
   
</body>
</html>
