<script>
var n = Number(window.prompt("Enter the number of elements:"));
var num = [];
var prime = [];
var nonprime = [];

for(i = 0; i < n; i++) {
    num.push(Number(window.prompt("Enter the numbers:")));
}

for(i = 0; i < n; i++) {

    count = 0;

    for(j = 1; j <= num[i]; j++) {
        if(num[i] % j == 0) {
            count++;
        }
    }

    if(count == 2)
        prime.push(num[i]);
    else
        nonprime.push(num[i]);
}

document.write("Given: " + num + "<br>");
document.write("Prime numbers are: " + prime + "<br>");
document.write("Not prime are: " + nonprime + "<br>");
</script>
