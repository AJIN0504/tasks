<html>
<body>
  <script>
    
    var x = Number(window.prompt("enter a number:"));
    var y = Number(window.prompt("enter another number:"));
    sum = x+y;
    
    if(sum % 2==0){
      document.write("the value after addition is "+ sum +" & its even");
     }
    else{
     document.write("the value after addition is "+ sum +" & its odd");
     }
  </script>
