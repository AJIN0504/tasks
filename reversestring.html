<html>
 <body>
  <h1> reverse a string </h1>
   <script>
    var s = window.prompt("please enter your string  : ");
  
    var rev = "";
    for(i = s.length-1;i>=0;i--){
        rev=rev+s[i];
      }
 document.write("the reverse of given string is " + rev);
 

  </script> 
 </body>        
</html>
